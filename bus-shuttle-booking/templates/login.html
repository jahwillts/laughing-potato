{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6 mt-8">
  <h2 class="text-2xl font-bold mb-4">Login</h2>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold mb-1">Email</label>
      <input type="email" name="email" class="w-full border rounded p-2" required>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Password</label>
      <input type="password" name="password" class="w-full border rounded p-2" required>
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded">Login</button>
  </form>
  <p class="mt-4 text-sm text-center text-slate-500">Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-600 hover:underline">Register</a></p>
</div>
{% endblock %}
