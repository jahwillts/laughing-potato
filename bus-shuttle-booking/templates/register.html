{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6 mt-8">
  <h2 class="text-2xl font-bold mb-4">Create Account</h2>
  <form method="post" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold mb-1">First Name</label>
        <input type="text" name="first_name" class="w-full border rounded p-2" required>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Last Name</label>
        <input type="text" name="last_name" class="w-full border rounded p-2" required>
      </div>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Email</label>
      <input type="email" name="email" class="w-full border rounded p-2" required>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Phone</label>
      <input type="tel" name="phone" class="w-full border rounded p-2">
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Role</label>
      <select name="role" class="w-full border rounded p-2">
        <option value="passenger">Passenger</option>
        <option value="driver">Driver</option>
        <option value="operator">Operator</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1">Password</label>
      <input type="password" name="password" class="w-full border rounded p-2" required>
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded">Register</button>
  </form>
  <p class="mt-4 text-sm text-center text-slate-500">Already have an account? <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Login</a></p>
</div>
{% endblock %}
