{% extends 'base.html' %}
{% block title %}Subjects - {{ school.name }}{% endblock %}
{% block content %}
<div class="card">
    <h2 class="text-2xl font-bold mb-4">Subjects</h2>
    <form method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <input type="text" name="name" placeholder="Subject name" required class="input">
        <input type="text" name="code" placeholder="Code" class="input">
        <button type="submit" class="btn-primary">Add Subject</button>
    </form>
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-slate-100"><tr><th>Name</th><th>Code</th></tr></thead>
            <tbody>
                {% for s in subjects %}
                <tr class="border-b"><td>{{ s.name }}</td><td>{{ s.code or '' }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
